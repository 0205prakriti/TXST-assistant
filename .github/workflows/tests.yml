name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies (without the heavy embedding stack)
        run: |
          grep -vE '^(#|chromadb|sentence-transformers|google-genai)' requirements.txt > ci-requirements.txt
          pip install -r ci-requirements.txt
      - name: Run offline tests
        run: python -m pytest -q
